<!doctype html>
<!--
  Coffee-prep loop for the pricing success state (HyperFrames composition).
  Re-render from this folder, then copy the file to src/assets/success/:
    npx hyperframes@0.8.162 render . --format mp4 -f 30 --variables '{"bg":"#F5F5F5"}' -o coffee-loop.mp4
  bg matches the card surface; a transparent WebM (--format webm) shows black in Safari.
-->
<html
  lang="sk"
  data-composition-variables='[{"id":"bg","type":"color","label":"Background","default":"transparent"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=680, height=360" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 680px;
        height: 360px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      svg {
        display: block;
        overflow: visible;
      }
      /* Coffister sticker style: thick ink outline, white fill, blue / red accents. */
      .o {
        stroke: #0c0c0c;
        stroke-width: 9;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="main"
      data-start="0"
      data-duration="4.4"
      data-width="680"
      data-height="360"
    >
      <svg width="680" height="360" viewBox="0 0 680 360">
        <defs>
          <clipPath id="cup-inside">
            <path d="M356 252 L414 252 L409 290 Q408 296 402 296 L368 296 Q362 296 361 290 Z" />
          </clipPath>
          <path id="star" d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14 Z" />
        </defs>

        <!-- ground coffee in flight: grinder chute -> machine hopper -->
        <g id="grounds" fill="#0c0c0c">
          <circle class="g" cx="206" cy="160" r="5" opacity="0" />
          <circle class="g" cx="206" cy="160" r="6" opacity="0" />
          <circle class="g" cx="206" cy="160" r="4" opacity="0" />
          <circle class="g" cx="206" cy="160" r="6" opacity="0" />
          <circle class="g" cx="206" cy="160" r="5" opacity="0" />
          <circle class="g" cx="206" cy="160" r="4" opacity="0" />
        </g>

        <!-- GRINDER -->
        <g id="grinder">
          <rect class="o" x="176" y="150" width="30" height="18" rx="5" fill="#ffffff" />
          <path class="o" d="M80 70 L180 70 L163 122 L97 122 Z" fill="#ffffff" />
          <g id="beans">
            <g transform="translate(110 98) rotate(-25)">
              <ellipse rx="12" ry="9" fill="#0c0c0c" />
              <path d="M-7 1 Q0 -4 7 1" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
            </g>
            <g transform="translate(131 88) rotate(15)">
              <ellipse rx="12" ry="9" fill="#0c0c0c" />
              <path d="M-7 1 Q0 -4 7 1" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
            </g>
            <g transform="translate(151 100) rotate(-5)">
              <ellipse rx="12" ry="9" fill="#0c0c0c" />
              <path d="M-7 1 Q0 -4 7 1" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
            </g>
          </g>
          <rect class="o" x="76" y="122" width="108" height="122" rx="18" fill="#ffffff" />
          <rect class="o" x="98" y="204" width="64" height="24" rx="7" fill="#0099ff" />
          <circle cx="130" cy="216" r="4.5" fill="#0c0c0c" />
          <g id="crank">
            <line class="o" x1="130" y1="165" x2="130" y2="134" />
            <circle class="o" cx="130" cy="132" r="10" fill="#f8513c" />
          </g>
          <circle cx="130" cy="165" r="8" fill="#0c0c0c" />
        </g>

        <!-- MACHINE: back column, tray, cup, housing -->
        <rect class="o" x="450" y="180" width="40" height="132" rx="10" fill="#ffffff" />
        <rect class="o" x="296" y="304" width="200" height="22" rx="11" fill="#ffffff" />

        <rect id="stream" x="381" y="212" width="8" height="0" rx="4" fill="#0c0c0c" />

        <g id="cup">
          <g id="cup-body">
            <path class="o" d="M412 262 C438 260 438 290 408 288" fill="none" />
            <path class="o" d="M352 248 L418 248 L412 292 Q411 300 403 300 L367 300 Q359 300 358 292 Z" fill="#ffffff" />
            <g clip-path="url(#cup-inside)">
              <rect id="liquid" x="350" y="300" width="70" height="0" fill="#0c0c0c" />
            </g>
            <use href="#star" transform="translate(385 278) scale(0.7)" fill="#ffffff" />
          </g>
          <g id="steam" fill="none" stroke="#f8513c" stroke-width="7" stroke-linecap="round" opacity="0">
            <path d="M374 236 C364 224 384 214 374 200" />
            <path d="M396 232 C386 220 406 210 396 196" />
          </g>
        </g>

        <g id="machine">
          <path class="o" d="M318 82 L314 54 L370 54 L366 82 Z" fill="#ffffff" />
          <rect class="o" x="296" y="80" width="194" height="118" rx="24" fill="#ffffff" />
          <rect class="o" x="364" y="196" width="42" height="18" rx="5" fill="#0c0c0c" />
          <rect class="o" x="404" y="100" width="66" height="34" rx="9" fill="#0099ff" />
          <rect id="progress" x="414" y="113" width="46" height="8" rx="4" fill="#ffffff" />
          <circle class="o" cx="330" cy="117" r="10" fill="#ffffff" />
          <circle id="light" cx="330" cy="117" r="10" fill="#f8513c" opacity="0" />
          <rect x="318" y="152" width="150" height="9" rx="4.5" fill="#0c0c0c" />
        </g>

        <g transform="translate(640 210)">
          <use id="sparkle" href="#star" fill="#0099ff" opacity="0" />
        </g>
      </svg>
    </div>

    <script>
      const { bg } = window.__hyperframes.getVariables();
      document.body.style.background = bg;

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut" } });
      const SERVE_X = 215;

      // 0.1–1.4 grind: crank turns twice, grinder shakes, beans sink.
      tl.fromTo("#crank", { rotation: 0 }, { rotation: 720, svgOrigin: "130 165", duration: 1.3, ease: "power1.inOut" }, 0.1);
      tl.fromTo("#grinder", { rotation: 0 }, { rotation: 2, svgOrigin: "130 244", duration: 0.13, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.1);
      tl.fromTo("#beans", { scale: 1 }, { scale: 0.55, svgOrigin: "130 122", duration: 1.1 }, 0.3);

      // grounds arc from the chute into the machine hopper
      gsap.utils.toArray(".g").forEach((dot, i) => {
        const t = 0.45 + i * 0.16;
        tl.set(dot, { opacity: 1, x: 0, y: 0 }, t);
        tl.to(dot, { x: 136, duration: 0.55, ease: "none" }, t);
        tl.to(dot, { y: -128, duration: 0.3, ease: "power2.out" }, t);
        tl.to(dot, { y: -104, duration: 0.25, ease: "power2.in" }, t + 0.3);
        tl.set(dot, { opacity: 0 }, t + 0.55);
      });

      // 1.6–2.9 brew: machine squish, light on, progress bar, pour into cup
      tl.fromTo("#machine", { scaleY: 1 }, { scaleY: 0.95, svgOrigin: "393 198", duration: 0.15, yoyo: true, repeat: 1 }, 1.65);
      tl.to("#light", { opacity: 1, duration: 0.1 }, 1.7);
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, svgOrigin: "414 117", duration: 1.1, ease: "none" }, 1.75);
      // stream and liquid animate geometry (attr), so no transform origin to drift
      tl.fromTo("#stream", { attr: { y: 212, height: 0 } }, { attr: { height: 46 }, duration: 0.2, ease: "power1.in" }, 1.9);
      tl.fromTo("#liquid", { attr: { y: 300, height: 0 } }, { attr: { y: 260, height: 40 }, duration: 0.85, ease: "power1.out" }, 2.0);
      tl.to("#stream", { attr: { y: 258, height: 0 }, duration: 0.15, ease: "power1.in" }, 2.8);
      tl.to(["#light", "#progress"], { opacity: 0, duration: 0.2 }, 3.0);

      // 3.0–3.8 serve: cup slides out, hops, steams, sparkle
      tl.to("#cup", { x: SERVE_X, duration: 0.4 }, 3.0);
      tl.to("#cup-body", { y: -10, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.out" }, 3.38);
      tl.fromTo("#steam", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.35);
      tl.fromTo("#steam", { y: 8 }, { y: -14, duration: 0.6, ease: "none" }, 3.35);
      tl.fromTo("#sparkle", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.2, ease: "back.out(3)" }, 3.45);
      tl.to("#sparkle", { opacity: 0, scale: 0, svgOrigin: "0 0", duration: 0.2, ease: "power1.in" }, 3.75);

      // 3.85–4.4 reset: served cup pops away, an empty one pops in, beans refill
      tl.to("#steam", { opacity: 0, duration: 0.15 }, 3.8);
      tl.to("#cup", { scale: 0, svgOrigin: `${385 + SERVE_X} 300`, duration: 0.18, ease: "back.in(2)" }, 3.85);
      tl.set("#cup", { x: 0, scale: 0, svgOrigin: "385 300" }, 4.04);
      tl.set("#liquid", { attr: { y: 300, height: 0 } }, 4.04);
      tl.set(["#light", "#progress"], { opacity: 1 }, 4.04);
      tl.set("#light", { opacity: 0 }, 4.04);
      tl.set("#progress", { scaleX: 0 }, 4.04);
      tl.to("#cup", { scale: 1, svgOrigin: "385 300", duration: 0.32, ease: "back.out(2)" }, 4.06);
      tl.to("#beans", { scale: 1, svgOrigin: "130 122", duration: 0.35, ease: "back.out(2.5)" }, 3.95);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
